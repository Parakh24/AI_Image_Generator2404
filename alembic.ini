[alembic]
# Migration scripts and env.py live here.
script_location = migrations

# Default DB URL for local dev - env.py overrides this with DATABASE_URL
# environment variable if it's set, so production doesn't need this edited.
sqlalchemy.url = sqlite:///./crmjio_image_gen.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S